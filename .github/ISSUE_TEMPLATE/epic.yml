name: Epic
description: A larger piece of work that groups related issues.
title: ''
body:
  - type: markdown
    attributes:
      value: |
        Check [existing issues](https://github.com/alxhslm/magic-apps/issues) first. An epic groups related issues under a common goal.
  - type: textarea
    id: outcome
    attributes:
      label: What is the outcome?
    validations:
      required: true
  - type: textarea
    id: child-issues
    attributes:
      label: Child issues
      description: Link the issues this epic covers. Leave it blank if they do not exist yet.
    validations:
      required: false
