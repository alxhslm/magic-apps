<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The squircle body is inset to 448 of the 512 canvas, as Magimail's is.
         macOS app icons are not full-bleed: the transparent margin is what makes
         every icon sit at the same visual size in the Dock, and the iconset
         generator's 448/512 constant assumes the artwork carries it. -->
    <clipPath id="macSquircleCal">
      <rect x="32" y="32" width="448" height="448" rx="100" ry="100" />
    </clipPath>
    <linearGradient id="calCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f6f0"/>
    </linearGradient>
    <linearGradient id="calHeaderBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ringMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="30%" stop-color="#fafafa"/>
      <stop offset="60%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <!-- Extruded page-stack edge under the front page: the calendar reads as a
         block of paper with real thickness, the same device the Magimail envelope
         uses for its slab edge. -->
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8b0a0"/>
      <stop offset="55%" stop-color="#a29a88"/>
      <stop offset="100%" stop-color="#8a8272"/>
    </linearGradient>
    <linearGradient id="wandBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E538C"/>
      <stop offset="50%" stop-color="#433B6E"/>
      <stop offset="100%" stop-color="#5E538C"/>
    </linearGradient>
    <filter id="shaftSoftAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- Shared suite background: identical stops to apps/magimail/build/icon.svg -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="45%" stop-color="#221D54"/>
      <stop offset="100%" stop-color="#362F78"/>
    </linearGradient>
    <!-- Shared suite stage glow: identical stops to Magimail's hatBacklight -->
    <radialGradient id="stageGlow" cx="50%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#4338CA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <!-- Shared suite squircle shadow: identical to Magimail -->
    <filter id="macShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="wandShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <!-- Clip for the folded corner cutout -->
    <clipPath id="foldClip">
      <path d="M 0 0 L 340 0 L 340 272 L 262 350 L 0 350 Z"/>
    </clipPath>

    <!-- The underside of the sheet, seen because the corner has rolled up. Shaded at
         the fold, bright across the crest, with the rim darkening again as the paper
         turns over. -->
    <linearGradient id="pageCurl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ada48d"/>
      <stop offset="30%" stop-color="#e9e2d2"/>
      <stop offset="68%" stop-color="#fffefb"/>
      <stop offset="100%" stop-color="#e2dbcb"/>
    </linearGradient>
    <filter id="curlShade" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="curlLift" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#4a4433" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="violetStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="30%" stop-color="#E9D5FF"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <radialGradient id="burstHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD07A" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#F0A93C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer squircle with macOS drop shadow, identical to Magimail -->
  <g filter="url(#macShadow)">
    <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)"/>
  </g>

  <g clip-path="url(#macSquircleCal)">
    <!-- Everything below is drawn on the original 512 grid and scaled into the
         448 body, so the composition is untouched by the inset. -->
    <g transform="translate(32,32) scale(0.875)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Ambient stars -->
    <circle cx="85"  cy="85"  r="2.0" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="430" cy="115" r="2.5" fill="#FFE57F" opacity="0.5"/>
    <circle cx="110" cy="425" r="1.5" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="410" cy="410" r="1.8" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="190" cy="65"  r="1.5" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="390" cy="445" r="1.5" fill="#FFFFFF" opacity="0.2"/>

    <!-- Ambient sparkles. Same glyph, weights and colours as Magimail's, placed to
         clear the card and the wand. Background decoration: the app icon only. -->
    <g filter="url(#sparkleGlow)">
      <g transform="translate(448, 300)">
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g transform="translate(365, 48)">
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#E9D5FF" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#E9D5FF" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g transform="translate(52, 375)">
        <line x1="0" y1="-6.5" x2="0" y2="6.5" stroke="#FBBF24" stroke-width="2.0" stroke-linecap="round"/>
        <line x1="-6.5" y1="0" x2="6.5" y2="0" stroke="#FBBF24" stroke-width="2.0" stroke-linecap="round"/>
        <line x1="-4" y1="-4" x2="4" y2="4" stroke="#FBBF24" stroke-width="1.0" stroke-linecap="round"/>
        <line x1="4" y1="-4" x2="-4" y2="4" stroke="#FBBF24" stroke-width="1.0" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Ambient stage glow, pooling under the card -->
    <ellipse cx="256" cy="425" rx="220" ry="95" fill="url(#stageGlow)"/>

    <!-- Calendar card — centred -->
    <!-- Card and its burst scale as one unit about the canvas centre, which is the
         card's own centre, so the burst stays pinned to the card's corner. Shrunk to
         leave the wand room to read. -->
    <g transform="translate(256, 256) scale(0.96) translate(-256, -256)">
    <!-- Rotated a touch off-plane about its own centre, as the Magimail envelope is,
         so the card reads as an object in space rather than a flat sticker. -->
    <g transform="translate(256, 256) rotate(-2.5) translate(-170, -175)">

      <!-- Page stack: three receding edges, then the extruded slab the front page
           sits on. Offset down-left so the light stays top-right, as in Magimail. -->
      <g filter="url(#cardShadow)">
        <rect x="-9" y="11" width="340" height="350" rx="16" fill="url(#cardEdge)" opacity="0.55"/>
        <rect x="-6" y="8" width="340" height="350" rx="16" fill="url(#cardEdge)" opacity="0.8"/>
        <rect x="-3" y="5" width="340" height="350" rx="16" fill="url(#cardEdge)"/>
      </g>

      <!-- Card body with folded corner cut out (reveals dark bg) — crisp vector, outside filter -->
      <rect x="0" y="0" width="340" height="350" rx="16" fill="url(#calCard)" stroke="#dcd4c3" stroke-width="1.5"/>


      <!-- Blue header band — single shape, rounded top corners only -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 324 0 A 16 16 0 0 1 340 16 L 340 120 L 0 120 Z" fill="url(#calHeaderBlue)"/>
      <line x1="0" y1="120" x2="340" y2="120" stroke="#1d4ed8" stroke-width="2"/>

      <!-- Month text (under rings) -->
      <text id="cal-month-text-back" x="170" y="98" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="68" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2.0">AUG</text>

      <!-- Ring binders — full metal bars running from above the page down through holes into the header -->
      <!-- Back portion of rings (behind the page, extending down through header) -->
      <rect x="96" y="-36" width="8" height="76" rx="4" fill="url(#ringMetal)"/>
      <rect x="236" y="-36" width="8" height="76" rx="4" fill="url(#ringMetal)"/>

      <!-- Re-draw header on top to cover where rings pass through -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 324 0 A 16 16 0 0 1 340 16 L 340 120 L 0 120 Z" fill="url(#calHeaderBlue)"/>

      <!-- Punch holes where rings enter the page (mid-header) -->
      <circle cx="100" cy="28" r="7" fill="#1a3f8f" stroke="#1e3a7a" stroke-width="1"/>
      <circle cx="100" cy="28" r="5" fill="#0c1e4a" opacity="0.5"/>
      <circle cx="240" cy="28" r="7" fill="#1a3f8f" stroke="#1e3a7a" stroke-width="1"/>
      <circle cx="240" cy="28" r="5" fill="#0c1e4a" opacity="0.5"/>

      <!-- Front portion of rings (above the page) -->
      <g filter="url(#ringShadow)">
        <rect x="96" y="-36" width="8" height="60" rx="4" fill="url(#ringMetal)"/>
        <rect x="97.5" y="-36" width="2.5" height="60" rx="1.2" fill="#ffffff" opacity="0.35"/>
        <rect x="236" y="-36" width="8" height="60" rx="4" fill="url(#ringMetal)"/>
        <rect x="237.5" y="-36" width="2.5" height="60" rx="1.2" fill="#ffffff" opacity="0.35"/>
      </g>

      <!-- Re-draw month text on top -->
      <text id="cal-month-text" x="170" y="98" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="68" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2.0">AUG</text>

      <!-- Date number -->
      <text id="cal-date-number" x="170" y="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="182" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-3">31</text>

      
    </g>
    </g>

    <!-- Delicate rim glow along shaft -->
    <g transform="translate(-2, 270) rotate(-60)" filter="url(#shaftSoftAura)">
      <rect x="-213" y="-10" width="362" height="20" rx="10" fill="#818CF8" opacity="0.45"/>
    </g>

    <!-- Magic Wand — rising from the bottom-left corner, tip stopping short of the
         calendar bevel so the shaft never crosses the face. -->
    <g transform="translate(-2, 270) rotate(-60)" filter="url(#wandShadow)">
      <!-- Wand shaft — long, extends well off left edge -->
      <rect x="-210" y="-7" width="356" height="14" rx="7" fill="url(#wandBody)" stroke="#B4C6FC" stroke-width="1.0"/>
      <!-- Shaft highlight -->
      <rect x="-210" y="-5" width="356" height="4" rx="2" fill="#ffffff" opacity="0.40"/>
      <!-- White tip (right end) -->
      <rect x="130" y="-9" width="36" height="18" rx="9" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="0.8"/>
      <rect x="130" y="-6" width="36" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- The burst is painted after the wand so the stars sit in front of the tip
         rather than behind it. Same scale as the card, so its position relative to
         the card is unchanged. -->
    <g transform="translate(256, 256) scale(0.96) translate(-256, -256)">
      <!-- Wand-tip burst. Magimail's concave four-point star, so the two icons share a
           motif and the burst is distinct from the ambient plus-shaped dust. Part of the
           calendar mark, so it appears in the standalone art too. -->
      <g transform="translate(-20, -20)">
      <g filter="url(#sparkleGlow)" transform="translate(125, 108) scale(1.45) translate(-125, -108)">
        <circle cx="125" cy="108" r="34" fill="url(#burstHalo)"/>
        <g transform="translate(125, 108)">
          <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#goldStar)"/>
          <path d="M 0 -9.0 Q 0 0 9.0 0 Q 0 0 0 9.0 Q 0 0 -9.0 0 Q 0 0 0 -9.0 Z" fill="#FFFDF2" opacity="0.65"/>
        </g>
        <g transform="translate(147, 84)">
          <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 11 Z" fill="url(#violetStar)"/>
          <path d="M 0 -5.5 Q 0 0 5.5 0 Q 0 0 0 5.5 Q 0 0 -5.5 0 Q 0 0 0 -5.5 Z" fill="#FFFDF2" opacity="0.65"/>
        </g>
      </g>
      </g>
    </g>

    </g>
  </g>
</svg>
